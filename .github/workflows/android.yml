name: android

on:
  push:
    branches: [main]
    paths: ["clients/android/**", "data/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["clients/android/**", "data/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # The action's default package list includes the long-removed "tools"
      # package, so name exactly what the build needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.1 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: native-steam-android-debug
          path: clients/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
